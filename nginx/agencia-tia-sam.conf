# Nginx — Agência Tia Sam (configuração de referência)
#
# Instalar em:
#   sudo cp nginx/agencia-tia-sam.conf /etc/nginx/sites-available/agencia-tia-sam.conf
#   sudo ln -s /etc/nginx/sites-available/agencia-tia-sam.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Substitua "seu-dominio.com.br" pelo domínio real em TODOS os lugares.
#
# Arquitetura:
#   HTTPS -> Nginx -> 127.0.0.1:4000 (Node: frontend + /api + /uploads)
#
# O Node (Express + Helmet) já aplica os headers de segurança (CSP etc.).
# Para evitar conflito, NÃO duplicar headers de segurança aqui além do mínimo.

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name seu-dominio.com.br www.seu-dominio.com.br;

    # Necessário p/ o Certbot validar o domínio antes do SSL ser emitido
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# Site HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name seu-dominio.com.br www.seu-dominio.com.br;

    # Preenchidos pelo Certbot (certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;

    # Margem para uploads (backend aceita até 6 MB)
    client_max_body_size 8m;

    # Encaminha TUDO (frontend, /api, /uploads) para o Node
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
